<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | UEM Labs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="section-shell" style="max-width:520px; margin:80px auto;">
    <div class="modal" style="display:block; position:static; box-shadow:none;">
      <div class="modal-icon">✦</div>
      <h2 id="modal-title">Set your password</h2>
      <p id="modal-copy">Enter your temporary password and choose a new one.</p>
      <form id="set-password-form">
        <label>Email<input name="email" type="email" required placeholder="you@company.com"></label>
        <label>Temporary password<input name="temporaryPassword" type="password" required placeholder="Temporary password"></label>
        <label>New password<input name="newPassword" type="password" required placeholder="New password"></label>
        <button class="button button-accent" type="submit">Save password →</button>
      </form>
    </div>
  </div>
  <script src="set-password.js"></script>
</body>
</html>
