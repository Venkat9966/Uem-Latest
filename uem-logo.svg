<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="uemBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b302a" />
      <stop offset="100%" stop-color="#0f1c18" />
    </linearGradient>
    <linearGradient id="uemLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecff79" />
      <stop offset="100%" stop-color="#c4f02a" />
    </linearGradient>
    <linearGradient id="uemTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="uemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#c4f02a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Modern squircle badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#uemBgGrad)" stroke="#2d4840" stroke-width="1.5" />
  
  <!-- Subtle device border track -->
  <rect x="7" y="7" width="50" height="50" rx="11" fill="none" stroke="#223932" stroke-width="1.2" stroke-dasharray="4 3" />
  
  <!-- Stylized UEM Arc (Unified Device Management Loop) -->
  <path d="M19 19 V33 C19 41.5 25 46.5 32 46.5 C39 41.5 45 41.5 45 33 V19" 
        stroke="url(#uemLimeGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#uemGlow)" />
        
  <!-- Connected Endpoint Nodes (Left: Mobile, Right: Desktop/Server) -->
  <circle cx="19" cy="19" r="4.5" fill="#14231f" stroke="#ecff79" stroke-width="2.5" />
  <circle cx="45" cy="19" r="4.5" fill="#14231f" stroke="#ecff79" stroke-width="2.5" />
  
  <!-- Central Lab Innovation Matrix / Data Core -->
  <path d="M26 27 H38 M26 33 H35" 
        stroke="url(#uemTealGrad)" 
        stroke-width="3" 
        stroke-linecap="round" />
  <circle cx="32" cy="33" r="2.2" fill="#ecff79" />
</svg>
